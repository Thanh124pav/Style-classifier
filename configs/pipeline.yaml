# Vietnamese Text Style Classification - Pipeline Config
# Used by run_pipeline.sh (reads merged data with "style" field)

# Data settings
data:
  input_path: "data/raw"
  output_path: "data/processed"
  text_field: "text"
  label_field: "style"       # merge_datasets.py outputs "style", not "label"
  test_size: 0.15
  val_size: 0.1
  seed: 42

# Label mapping (must match labels in merged data)
labels:
  - "bao_chi"
  - "hanh_chinh"
  - "sinh_hoat"
  - "khoa_hoc"
  - "chinh_luan"

label_display:
  bao_chi: "Báo chí"
  hanh_chinh: "Hành chính"
  sinh_hoat: "Sinh hoạt"
  khoa_hoc: "Khoa học"
  chinh_luan: "Chính luận"

# Preprocessing & dedup are handled by normalize_data.py (before training)
# See: scripts/normalize_data.py and run_pipeline.sh stage 3

# Chunking settings for long texts
chunking:
  enabled: true
  max_length: 512
  stride: 128
  aggregation: "mean"

# Model settings
model:
  name: "bert-base-multilingual-cased"
  max_length: 256
  num_labels: 5

# Training settings
training:
  output_dir: "outputs"
  num_epochs: 5
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  bf16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 500
  save_total_limit: 3
  early_stopping_patience: 3
  metric_for_best_model: "f1_macro"
